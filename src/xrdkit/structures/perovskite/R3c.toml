# Rhombohedral perovskite ABO3 of the BiFeO3 (and LiNbO3) type, R3c on
# hexagonal axes, from BiFeO3: Moreau, Michel, Gerson and James, J. Phys.
# Chem. Solids 32 (1971) 1315-1320, doi:10.1016/S0022-3697(71)80189-0,
# COD 1001090. Palewicz et al., Acta Cryst. B 63 (2007) 537-544, COD 2102909,
# has the same sites.
#
# The hexagonal cell holds six ABO3: six A positions (A1 on 6a), six B
# positions (B1 on 6a) and eighteen O (O1 on 18b), so Z = 6.
#
# CIF labels for each site: A1 is Bi1; B1 is Fe1; O1 is O1.
#
# R3c is polar along c, so no site symmetry fixes the origin along z, and one
# site's z has to be held. A1 holds it, at z = 0, as Bi1 does in the CIF.

[entry]
name = "perovskite/R3c"
family = "perovskite"
crystal_system = "trigonal"
space_group = "R3c"
setting = "hexagonal"
cell_parameters = ["a", "c"]
z = 6
polar_axis = "c"
origin_site = "A1"
reference = "BiFeO3, COD 1001090"

# A1 is on 6a, (0, 0, z).
[[sites]]
label = "A1"
kind = "A"
wyckoff = "6a"
free = ["z"]
uiso_group = "A"

# B1 is on 6a, (0, 0, z).
[[sites]]
label = "B1"
kind = "B"
wyckoff = "6a"
free = ["z"]
uiso_group = "B"

# O1 is on 18b, the general position.
[[sites]]
label = "O1"
kind = "O"
wyckoff = "18b"
free = ["x", "y", "z"]
uiso_group = "O"
