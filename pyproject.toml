[project]
name = "xrdkit"
version = "0.1.0"
description = "Reusable X-ray diffraction analysis toolkit for electroceramics research"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Amir Khesro", email = "am.khesro@gmail.com" }
]
keywords = [
    "x-ray diffraction",
    "XRD",
    "powder diffraction",
    "Rietveld",
    "Le Bail",
    "GSAS-II",
    "materials science",
    "ceramics",
    "crystallography",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Typing :: Typed",
]
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.0.0",
    "scipy>=1.13.0",
]

[project.urls]
Homepage = "https://github.com/amirkhesro/xrdkit"
Repository = "https://github.com/amirkhesro/xrdkit"
Issues = "https://github.com/amirkhesro/xrdkit/issues"
Changelog = "https://github.com/amirkhesro/xrdkit/blob/main/CHANGELOG.md"

[project.scripts]
xrdkit = "xrdkit.cli:main"

[project.optional-dependencies]
phases = [
    "pymatgen>=2026.5.4",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
