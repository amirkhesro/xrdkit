[project]
name = "xrdkit"
version = "0.1.0"
description = "Reusable X-ray diffraction analysis toolkit for electroceramics research"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Amir Khesro", email = "174715580+amirkhesro@users.noreply.github.com" }
]
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
